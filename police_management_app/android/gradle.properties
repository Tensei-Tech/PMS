# gradle.properties
# Project-wide Gradle settings.

# Enable Gradle Daemon for faster subsequent builds
org.gradle.daemon=true

# Enable parallel execution of tasks across subprojects
org.gradle.parallel=true

# Enable build caching to reuse outputs from previous builds
org.gradle.caching=true

# Enable Gradle File System Watching (drastically speeds up Windows builds & rebuilds)
org.gradle.vfs.watch=true

# Configure on Demand (incubating optimization)
org.gradle.configureondemand=true

# Optimize JVM arguments for better build performance and memory management
# -Xmx4096m: Allocate up to 4GB RAM to Gradle build
# -XX:+UseParallelGC: Low-overhead garbage collector for high build throughput
# -XX:MaxMetaspaceSize=1024m: Optimize class metadata memory
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8 -Dkotlin.daemon.jvm.options=-Xmx2048m

# Enable AndroidX and Jetifier for modern package compatibility (Required for local_auth)
android.useAndroidX=true
android.enableJetifier=true

# Enable incremental Kotlin compilation & Kapt incremental
kotlin.incremental=true
kapt.incremental.apt=true

# Enable D8 / DEX optimizations
android.enableD8=true
android.enableD8.desugaring=true

# Recommended: Reduce size of R classes in libraries (faster builds, smaller APK)
android.nonTransitiveRClass=true

# Flutter migrator flags
android.builtInKotlin=false
android.newDsl=false

