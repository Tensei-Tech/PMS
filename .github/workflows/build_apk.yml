name: Build Android APK (Cloud Build)

on:
  push:
    branches: [ "developer", "main", "master" ]
  pull_request:
    branches: [ "developer", "main", "master" ]
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-apk:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: |
          cd police_management_app
          flutter pub get

      - name: Build Release APK
        run: |
          cd police_management_app
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: khakhi-diary-app-release
          path: police_management_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
